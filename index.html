<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="小 P 的 32 种表情。">
  <title>Little P</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="site/style.css">
</head>
<body>
  <a class="skip-link" href="#thumbFlow" data-i18n="skipContent">跳至表情</a>
  <div class="workspace">
    <header class="topbar">
      <div class="brand"><span id="brandBall" class="brand-ball" aria-hidden="true"></span>Little P</div>
      <div class="top-actions">
        <button id="langToggle" type="button" class="icon-btn lang-btn" aria-label="切换语言">EN</button>
        <button id="themeToggle" type="button" class="icon-btn" aria-label="切换主题"><svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg><svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button>
      </div>
    </header>
    <section class="hero" id="hero">
      <canvas id="heroField" class="hero-field" aria-hidden="true"></canvas>
      <div class="hero-inner">
        <div class="hero-copy">
          <h1 data-i18n="heroTitle">Little P</h1>
          <div class="hero-actions">
            <button type="button" id="heroCta" class="hero-cta"><span data-i18n="heroCta">浏览表情</span><span aria-hidden="true">↓</span></button>
            <button type="button" id="summonPet" class="summon-btn"><span data-i18n="summonLabel">召唤</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></button>
            <a id="downloadPet" class="download-pet" data-i18n="downloadPet" hidden>下载桌宠</a>
          </div>
        </div>
        <div class="hero-visual"><button type="button" id="heroBot" class="hero-bot" aria-label="点击与小 P 互动"></button></div>
      </div>
    </section>
    <main class="gallery" id="gallery">
      <div class="gallery-head">
        <div id="castRow" class="cast-row" role="group" aria-label="选择小 P"></div>
        <div class="head-controls">
          <label class="head-switch"><input type="checkbox" id="sketchToggle"><span data-i18n="lblSketch">线稿</span></label>
          <label class="head-switch"><input type="checkbox" id="tourToggle"><span data-i18n="lblTour">自动播放</span></label>
          <select id="tourInterval" class="select" aria-label="播放间隔"><option value="1500">1.5s</option><option value="2500" selected>2.5s</option><option value="4000">4s</option></select>
        </div>
      </div>
      <div class="thumb-zone" id="thumbZone"><div id="thumbFlow" class="thumb-flow" role="group" aria-label="32 种表情"></div></div>
    </main>
  </div>
  <div class="stage-zone" role="dialog" aria-modal="true" aria-labelledby="emoName" tabindex="-1">
    <button type="button" id="navPrev" class="pager-btn" aria-label="上一个表情"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="stage-block">
      <button type="button" id="stageClose" class="icon-btn stage-close" aria-label="关闭预览">×</button>
      <div id="tips" class="tips" role="status"></div>
      <div id="stage" class="stage"></div>
      <div class="emo-meta"><span id="emoName" class="emo-name">待机</span><span id="pager" class="pager-ind">03 / 32</span></div>
    </div>
    <button type="button" id="navNext" class="pager-btn" aria-label="下一个表情"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 6 6 6-6 6"/></svg></button>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="engine/core/geometry.js"></script><script src="engine/core/render.js"></script><script src="engine/core/features.js"></script><script src="engine/core/fx.js"></script><script src="engine/data/emotions.js"></script><script src="engine/core/engine.js"></script><script src="site/robot.js"></script><script src="site/distribution.js?v=0.2.0"></script><script src="site/i18n.js?v=0.2.0"></script><script src="site/app.js?v=0.2.0"></script><script src="site/background.js"></script>
</body>
</html>
