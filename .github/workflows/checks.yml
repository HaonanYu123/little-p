name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check Python
        run: python -m py_compile runtime_paths.py desktop_host.py desktop/pet.py desktop/menu.py desktop/health_api.py desktop/health_assistant.py littlep_app.py serve.py
      - name: Check health assistant adapters and local secret storage
        run: python scripts/verify-health-assistant.py
      - name: Check release privacy
        run: python scripts/verify-release-privacy.py
      - name: Check JavaScript
        shell: pwsh
        run: |
          Get-ChildItem site,engine -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName }
