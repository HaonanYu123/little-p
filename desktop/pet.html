<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>P Studio Desktop Pet</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;user-select:none;-webkit-user-select:none}body{--sketch-ink:#536757}body.dark{--sketch-ink:#d9e7dc}#pet{position:absolute;inset:6.7742% 5.8065% 7.7419%;cursor:grab;touch-action:none}#pet.dragging{cursor:grabbing}.mm-svg{display:block;overflow:visible}#hint{position:absolute;top:2px;left:10px;right:10px;margin:auto;width:max-content;max-width:calc(100% - 20px);padding:8px 12px;background:#fff4f8ed;color:#8d5164;border:1px solid #ffd5e2;border-radius:13px;font:11px 'Microsoft YaHei',sans-serif;box-shadow:0 3px 12px #8f476513;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}#hint.show{opacity:1}#dismiss{position:absolute;top:9px;right:9px;width:22px;height:22px;border:1px solid #ecc3d3;border-radius:50%;background:#fff4f8dd;color:#ad6c81;font:18px Arial;cursor:pointer;opacity:0;transition:opacity .15s}body:hover #dismiss,#dismiss:focus-visible{opacity:1}
</style></head>
<body><div id="pet" aria-label="桌面小 P"></div><div id="hint" role="status"></div><button id="dismiss" aria-label="收起桌面小 P" title="收起小 P">×</button>
<script src="../engine/core/geometry.js"></script><script src="../engine/core/render.js"></script><script src="../engine/core/features.js"></script><script src="../engine/core/fx.js"></script><script src="../engine/data/emotions.js"></script><script src="../engine/core/engine.js"></script><script src="../site/robot.js"></script><script src="pet.js"></script>
</body></html>
